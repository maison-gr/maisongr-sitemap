name: Release

# Publishes to npm when a GitHub release is published, through npm trusted publishing:
# no token is stored, and npm records a provenance attestation linking the package to
# this workflow run and commit.
#
# Set up once on npmjs.com, in the package's settings → Trusted publisher:
# GitHub Actions, organisation maison-gr, repository sitemap, workflow release.yml,
# environment npm, and allow `npm publish`.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # required for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1 or later, which ships with Node.js 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check that the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "${{ github.event.release.tag_name }}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && node test/smoke.mjs
      # npm refuses a version twice. When this one is already there (published by hand, or the
      # release run again), say so and stop cleanly instead of failing the release.
      - name: Check whether this version is already on npm
        id: registry
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "maisongr-sitemap@$version" version >/dev/null 2>&1; then
            echo "::notice::maisongr-sitemap@$version is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public
