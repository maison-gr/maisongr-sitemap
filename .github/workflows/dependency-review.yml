name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The package ships with no runtime dependencies. Fail any pull request that adds a
      # vulnerable one, or one under a license that is incompatible with MIT.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only
          comment-summary-in-pr: on-failure
